name: Resource contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest psutil
      - run: python -m pytest -q test_reply_delivery.py test_google_updates.py test_file_workflow.py test_support_bundle.py test_system_info.py test_resource_catalog.py test_resource_cli.py test_exact_app_discovery.py test_request_planning.py test_intent_guard.py test_model_benchmark.py
  brain:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip install -r requirements-google.txt
      - run: python -c "from google_auth_oauthlib.flow import InstalledAppFlow; from keyring.backends.Windows import WinVaultKeyring; import googleapiclient.discovery"
      - run: python -m pytest -q test_voice_delivery.py test_reply_delivery.py test_google_updates.py test_acceptance.py test_send_intent.py test_resource_integration.py test_execution_truth.py test_resource_execution.py test_task_memory.py test_audio_pipeline.py test_start_ultron.py test_verify_ultron.py test_ollama_runtime.py test_voice_listener.py

  acceptance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - run: python ultron_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-report
          path: runtime/support/ultron-acceptance-*.zip
