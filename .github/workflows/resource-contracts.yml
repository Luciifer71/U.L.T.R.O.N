name: Resource contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest psutil
      - run: python -m pytest -q tests/test_package_layout.py tests/test_microphone_runtime.py tests/test_reply_delivery.py tests/test_google_updates.py tests/test_file_workflow.py tests/test_support_bundle.py tests/test_system_info.py tests/test_resource_catalog.py tests/test_resource_cli.py tests/test_exact_app_discovery.py tests/test_request_planning.py tests/test_intent_guard.py tests/test_model_benchmark.py
  brain:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements/test.txt
      - run: python -m pip install -r requirements/google.txt
      - run: python -m pip install faster-whisper==1.2.1
      - run: python -m pytest -q tests/test_speech_activity.py
      - run: python -c "from google_auth_oauthlib.flow import InstalledAppFlow; from keyring.backends.Windows import WinVaultKeyring; import googleapiclient.discovery"
      - run: python -m pytest -q tests/test_voice_delivery.py tests/test_reply_delivery.py tests/test_google_updates.py tests/test_acceptance.py tests/test_send_intent.py tests/test_resource_integration.py tests/test_execution_truth.py tests/test_resource_execution.py tests/test_task_memory.py tests/test_audio_pipeline.py tests/test_start_ultron.py tests/test_verify_ultron.py tests/test_ollama_runtime.py tests/test_voice_listener.py

  acceptance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements/test.txt
      - run: python run_ultron.py accept
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-report
          path: runtime/support/ultron-acceptance-*.zip

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest psutil -r requirements/browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_youtube_playback.py
        env:
          ULTRON_BROWSER_TESTS: '1'

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - run: python run_ultron.py --help
      - name: Installed command works outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          ULTRON_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          ultron --help
          ultron benchmark --help

  nats-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create a stopped container with the former config mount
        run: |
          cp docker-compose.yml /tmp/ultron-compose-current.yml
          cp config/nats-server.conf nats-server.conf
          sed -i 's|./config/nats-server.conf|./nats-server.conf|' docker-compose.yml
          mkdir -p nats_data
          echo preserved > nats_data/migration-marker
          docker compose up -d nats
          docker compose stop nats
          cp /tmp/ultron-compose-current.yml docker-compose.yml
          rm nats-server.conf
      - name: Launcher reconciles the container and preserves bind data
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          from unittest.mock import patch
          from ultron.cli import start_ultron
          with patch.object(start_ultron, 'find_executable', return_value=shutil.which('docker')):
              start_ultron.ensure_nats('nats://127.0.0.1:4222')
          assert Path('nats_data/migration-marker').read_text().strip() == 'preserved'
          PY
          docker inspect nats --format '{{json .Mounts}}' | python -c "import json,sys; mounts=json.load(sys.stdin); assert any(m['Source'].endswith('/config/nats-server.conf') and m['Destination']=='/etc/nats/nats-server.conf' for m in mounts)"
      - name: Stop CI container
        if: always()
        run: docker compose down
