[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-desktop"
version = "0.1.0.dev0"
description = "ULTRON desktop assistant source package"
requires-python = ">=3.12"
# Runtime dependency sets remain in requirements.txt and requirements/.
# This packaging migration does not change existing ownership terms.

[project.scripts]
ultron = "ultron.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
