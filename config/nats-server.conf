server_name: "ultron-nats"

port: 4222

http_port: 8222

jetstream {
  store_dir: "/data"
}

websocket {
  host: "0.0.0.0"
  port: 9222

  # Local development only.
  # Production will use TLS.
  no_tls: true

  same_origin: false

  allowed_origins: [
    "http://localhost:5173",
    "http://127.0.0.1:5173"
  ]

  handshake_timeout: "5s"
}