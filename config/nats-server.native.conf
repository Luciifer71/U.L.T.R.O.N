# NATS run directly on Windows (no Docker). Started by start-ultron.cmd when
# tools/nats/nats-server.exe exists (install it once: run_ultron.py setup-nats).
#
# Everything binds to 127.0.0.1 only. The bus has no authentication, so it
# must never be reachable from the network. (The Docker config listens on all
# interfaces inside the container; Docker publishes it on 127.0.0.1 only.)

server_name: "ultron-nats"

listen: "127.0.0.1:4222"

http: "127.0.0.1:8222"

jetstream {
  # Relative to the project folder (the launcher starts NATS there).
  store_dir: "nats_data"
}

websocket {
  host: "127.0.0.1"
  port: 9222

  # Local development only.
  no_tls: true

  same_origin: false

  allowed_origins: [
    "http://localhost:5173",
    "http://127.0.0.1:5173"
  ]

  handshake_timeout: "5s"
}
